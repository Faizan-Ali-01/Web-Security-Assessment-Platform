<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Security Assessment Platform</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Web Security Assessment Platform</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Scans</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Reports</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      {% if error %}
      <div class="alert alert-warning" role="alert">{{ error }}</div>
      {% endif %}

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <form method="post" action="{{ url_for('scan') }}">
            <div class="row g-3 align-items-end">
              <div class="col-lg-10">
                <label for="website-url" class="form-label fw-semibold text-muted">Website URL</label>
                <input
                  id="website-url"
                  name="website_url"
                  type="url"
                  class="form-control form-control-lg"
                  placeholder="https://example.com"
                  aria-label="Website URL"
                  required
                />
              </div>
              <div class="col-lg-2 d-grid">
                <button type="submit" class="btn btn-danger btn-lg fw-semibold">
                  Start Security Scan
                </button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <div class="row g-4">
        <div class="col-lg-4">
          <section class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <h5 class="text-uppercase small text-muted mb-3">Security Score</h5>
              <div class="display-4 fw-bold text-success">--</div>
              <p class="text-muted mt-3 mb-0">No scan results yet.</p>
            </div>
          </section>
        </div>

        <div class="col-lg-8">
          <section class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <h5 class="text-uppercase small text-muted mb-3">Findings</h5>
              <div class="border rounded p-3 bg-light text-muted">
                Waiting for scan output...
              </div>
            </div>
          </section>
        </div>
      </div>

      <section class="card border-0 shadow-sm mt-4">
        <div class="card-body p-4">
          <h5 class="text-uppercase small text-muted mb-3">Recent Scans</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Target</th>
                  <th scope="col">Date</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="3" class="text-center text-muted py-4">
                    No scans available yet.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
